<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>School Transport Safety Console — Login</title>
<link rel="stylesheet" href="css/style.css" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <h1>🚌 Transport Safety Console</h1>
      <p style="color:#6B7686; font-size:0.85rem; margin-bottom:22px;">Login karke apna role select karo</p>

      <label>Select your role</label>
      <div class="role-options" id="roleOptions">
        <div class="role-btn selected" data-role="admin">Admin</div>
        <div class="role-btn" data-role="driver">Driver</div>
        <div class="role-btn" data-role="parent">Parent</div>
      </div>

      <label>Name</label>
      <input type="text" id="nameInput" placeholder="e.g. Rakesh Sharma" />

      <button class="btn btn-primary" style="width:100%; justify-content:center;" onclick="login()">Login →</button>
    </div>
  </div>

  <script src="js/script.js"></script>
  <script>
    let selectedRole = "admin";

    document.querySelectorAll(".role-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".role-btn").forEach(b => b.classList.remove("selected"));
        btn.classList.add("selected");
        selectedRole = btn.dataset.role;
      });
    });

    function login() {
      const name = document.getElementById("nameInput").value || "Guest";
      // Save who logged in so other pages can greet them
      localStorage.setItem("stsc_user", JSON.stringify({ name, role: selectedRole }));

      if (selectedRole === "admin") window.location.href = "dashboard.html";
      else if (selectedRole === "driver") window.location.href = "boarding.html";
      else window.location.href = "notifications.html";
    }
  </script>
</body>
</html>
